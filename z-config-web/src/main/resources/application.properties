# z-config-web 运行期配置
#
# 2026-10-21 新增 (TASK-20261021-012)。此前本模块**没有** application.properties,
# 生产配置 100% 来自 deploy/k8s/01-deployment.yaml 的 env —— 那份 env 只给
# Z_BASE_DB_CONFIG_* 四件(数据源), 不给本文件里的任何键, 两边不打架:
# Spring Boot 的 env(系统环境变量)优先级高于 application.properties,
# 需要临时改口径时用 env 覆盖即可, 不用改本文件。
#
# ————————————————————————————————————————————————————————————————————
# SSO 闸门 (z-ctc 4A 中心, 与 opc/ops/oss/ctc 四个域同一套)
# ————————————————————————————————————————————————————————————————————
# 裸奔根因: 此前 z-config-web 只有自带的 TokenInterceptor, 它的开关
#   z.config.auth.enabled 默认 false 且全仓无处配置 ⇒ 拦截器是空操作
#   ⇒ /api/config/list 对公网裸奔 200。
# 现在由 z-ctc-sso 的 SsoAutoConfiguration 自动装配 SsoInterceptor 兜底,
# 语义与其它四个域一致: Accept 含 application/json ⇒ 401,
# 浏览器口径 ⇒ 302 跳登录页 (不是"一律拒绝", 带合法 token 仍放行)。
#
# 只拦 /api/**: 本服务同域还挂着前端 SPA 的静态资源(/、/index.html、/assets/**),
# 若连它一起拦, 页面根本加载不出来, 也就永远走不到登录页。
# (z-ops / z-opc 的 intercept-paths 同样是只覆盖 api 段, 口径一致。)
#
# ⚠ 2026-10-22 (TASK-20261022-020 · T2): 当时**必须显式把 /nacos/** 加进来**。
#   原教训: 兼容面 /nacos/v1/** 曾对公网**完全免鉴权**(匿名可读 + 可发布 + 可删配置),
#   根因是「三道门, 两道开着, 第三道根本不存在」——
#     ① sso.exclude-paths 里有 /nacos/** ⇒ 闸门第 ② 条直接放行;
#     ② sso.intercept-paths 只有 /api/** ⇒ 闸门第 ③ 条(不在拦截范围 ⇒ 放行)**又放一次**;
#     ③ WebConfig 把 /nacos/** 排除在 TokenInterceptor 之外 ⇒ 第三次放行;
#     ④ NacosCompatibleController 里**没有任何 accessToken 校验**(只有一句注释声称有)。
#   ⇒ 只从 exclude-paths 里删掉 /nacos/** 是**无效修复**: 第 ③ 条照样放行。
#
# ⚠ 2026-10-22 (TASK-20261022-T1 · 用户拍板 T1 = 直接下线): **/nacos/** 又从拦截范围里移除了**,
#   但这次与 T2 的理由**完全相反**, 别照抄历史结论:
#   T2 移除的理由是「兼容面要留着, 得靠闸门兜底」; T1 移除的理由是「**兼容面不存在了**」。
#   闸门是 HandlerInterceptor, 它在 handler 映射之后、真正处理之前执行 ⇒
#   只要 /nacos/** 还在拦截范围里, 兼容面路径的落点就永远是 **401/302(被闸门拦)**,
#   而**不是 404(端点没注册)**。那等于对外宣称"这里有个 Nacos 兼容面, 只是你进不去" ——
#   属于**假装下线**(还泄露了"曾经有兼容面"这一信息)。
#   ⇒ 口径统一为: **兼容面路径 = 没有 handler = 404**。
#   防线改由**构建期**承担: NacosCompatOfflinePinTest 断言真实 RequestMappingHandlerMapping
#   里**没有任何** /nacos/** 映射 —— 谁把兼容面加回来, 谁就让构建变红。
sso.intercept-paths=/api/**

# 放行名单 (纯路径前缀匹配, AntPathMatcher, 无 HTTP 方法维度):
#   /api/config-auth/**  —— z-config 自带的登录端点(临时方案, 见 ConfigAuthController)。
#                           留着是因为它只发**本地 UUID token**, 不构成 SSO 绕过:
#                           SSO 闸门只认 sso_token/zctc_token 里的 JWT, 认不了 UUID。
#                           ⚠ 它自带硬编码默认账号 admin/admin —— 是已知风险, 见本次结论。
#   /api/public/**, /api/auth/** —— 本仓既有的公开接口口径(与 WebConfig 的排除名单对齐)。
#   /actuator/**         —— 探针(readinessProbe 打的就是 /actuator/health), 收了就 CrashLoop。
#   /doc.html, /v3/api-docs/**, /swagger-ui/**, /swagger-resources/** —— API 文档。
# ⚠ 2026-10-22 (TASK-20261022-020 · T2): 当时把 /nacos/** 从本名单移除。
#   原注释(留档备查)：「/nacos/** —— nacos-client 走自己的 accessToken 机制, 与本服务 cookie 无关;
#   拦掉等于让标准 nacos-client 全部接不进来。」
#   ⇒ 那条注释描述的是**目标形态**(T1 选项①: 保留兼容面但强制 accessToken),
#     而**当时代码里根本没有 accessToken 校验** ⇒ 注释与实现不符 = 裸奔。
# ⚠ 2026-10-22 (TASK-20261022-T1 · 用户拍板 T1 = 直接下线): **结论不变, 但理由变了** ——
#   兼容面整个没了, 既不需要"接进来"也不需要"拦下来"; 本名单**任何情况下**都不得再出现 /nacos/**
#   (出现在 exclude-paths 里 = 把一条已下线的路径显式豁免, 是在给后人留"从这里可以放行"的伏笔)。
sso.exclude-paths=/api/config-auth/**,/api/public/**,/api/auth/**,/actuator/**,/doc.html,/v3/api-docs/**,/swagger-ui/**,/swagger-resources/**,/error

# 闸拦下后 302 去哪: 跳 opc 主壳的登录页 (与 z-ops 同一入口) ——
# 它真调 /ctc/authn/login 并已实现读 ?redirect= 回跳, 是当前唯一能签发 SSO cookie 的入口。
# ⚠ 不要指回环(127.0.0.1 指的是终端用户自己的机器), 也不要指 ctc.zopc.top
#   (它服务的是接入前的 mock 登录页, 登完等于没登)。
sso.login-url=${SSO_LOGIN_URL:https://opc.zopc.top/login}

# SSO cookie 候选名: 与 z-opc/z-ops 同口径。opc 签发的 cookie 落在 .zopc.top 域下,
# 本域收得到; 名字对不上就等于没登录。
sso.token-cookie-names[0]=sso_token
sso.token-cookie-names[1]=zctc_token
sso.token-cookie-names[2]=idea-bfcfe0a7

# ————————————————————————————————————————————————————————————————————
# z-config 自带的 TokenInterceptor (ConfigAuthController 那一套本地 UUID token)
# ————————————————————————————————————————————————————————————————————
# **显式关掉**。它的规则是「token 非空即视为有效」(源码里自己标了 TODO),
# 生产上开着等于给所有人开后门; 真正的闸门是上面的 SSO 闸门。
# 这里写死 false 是为了让口径唯一 —— 谁也不会误以为 z.config.auth.enabled=true
# 能当鉴权用(它默认就是 false, 且全仓无处配置)。
z.config.auth.enabled=false

# ————————————————————————————————————————————————————————————————————
# Nacos 兼容面 (/nacos/v1/**) —— **已下线**（2026-10-22，用户拍板 T1 = ② 直接下线）
# ————————————————————————————————————————————————————————————————————
# 决策依据（用户 2026-10-22 拍板，三选一里选了 ②「直接下线」）：
#   ① 保留兼容面 + 强制 accessToken —— **作废**；
#   ② 直接下线 —— **本节即其落地**；
#   ③ 收进内网 —— 未采用。
# 落地口径（**不是**「留个开关说以后再说」，是**代码里根本没有这条路径**）：
#   * NacosCompatibleController 已**整个删除** ⇒ Spring 里没有任何 /nacos/** 的 handler
#     ⇒ 请求落点是 **404**（不是 401/403：那会显得"存在但没权限"，属于假装下线）；
#   * 选项①的预备件（NacosCompatProperties / NacosAccessTokenVerifier /
#     NacosAccessTokenAuthFilter / NacosCompatAuthConfig）已**整个删除**
#     ⇒ **没有任何开关可开**，后人无法"误开"一条已下线的兼容面；
#   * 原来那四个 nacos.compat.* 键（access-token.enabled / access-token.secret /
#     access-token.ttl-seconds / metadata-endpoints.enabled）已**从本文件删除** ——
#     留着 metadata-endpoints.enabled=true 这种"看起来还开着"的值就是在制造假绿。
#   * WebConfig 的 SPA 回落把 nacos/ 前缀排除 ⇒ 兼容面路径不会以「200 + index.html」诈尸；
#   * sso.intercept-paths 里的 /nacos/** 也一并移除（理由见上面那段注释）。
# 下线不影响谁：集群 20 个 Deployment / 全部 env 对 Nacos **零引用**（实测无一项含 nacos 字样），
#   集群内**没有**真 Nacos 服务，z-config-web 日志里 POST /nacos/v1/cs/configs 出现 **0** 次
#   ⇒ 没有任何现存调用方会被打断。
# 自有 API 在 /api/config/**（POST + JSON body + Result 包装），与兼容面两套签名，互不影响。
#
# ⚠ 若将来确需恢复兼容面：**不要**在本文件加一个开关了事（那正是本次删除的东西）。
#   那是一次产品决策，需要：① 新的卡与用户拍板；② 重新引入鉴权设计（accessToken 或收进内网）；
#   ③ 把 NacosCompatOfflinePinTest 的断言一起改掉，否则构建会红（这是有意的）。
