                                                    - mark [ref=e690]:
                                                        - text: ‌
                                                        - strong [ref=e691]: 自动化开发流程
                                                        - text: ‌
                                                    - text: ：支持 Auto Mode 自动执行模式，可自主完成低风险操作、拆解复杂任务、批量重构代码及运行测试，无需逐一点确认 。‌‌
                                                    - generic [ref=e695] [cursor=pointer]: "3"
                                                - listitem [ref=e696]:
                                                    - mark [ref=e697]:
                                                        - text: ‌
                                                        - strong [ref=e698]: 全域电脑操控
                                                        - text: ‌
                                                    - text: ：具备 Computer Use 能力，能自主操控鼠标键盘，独立打开 IDE、终端、浏览器等，实现从搭建项目到部署上线的全流程闭环 。‌‌
                                                    - generic [ref=e702] [cursor=pointer]: "3"
                                                - listitem [ref=e703]:
                                                    - mark [ref=e704]:
                                                        - text: ‌
                                                        - strong [ref=e705]: 超长上下文理解
                                                        - text: ‌
                                                    - text: ：支持 100 万 Token 上下文，可一次性读取完整源码库和配置文件，深度理解项目架构与技术选型 。‌‌
