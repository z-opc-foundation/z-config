# z-config 服务端部署（ns z-config）
#
# DB：阿里云 RDS rm-bp108uqlgwn712k54ho.mysql.rds.aliyuncs.com，库 oc。
# **库里的 z_* 表已经存在且有数据（z_config_info 8 行、z_users 1 行），
# 比仓内 _doc/002_deploy/init.sql 还新（多一张 z_config_approval）——
# 所以这里不建库、不跑 init.sql，只让应用连上去。**
#
# 口令走 Secret z-config-db（用 kubectl create secret 命令在集群里建，
# 不落明文进仓）：见文件末尾注释的命令。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: z-config-web
  namespace: z-config
  labels:
    app: z-config-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: z-config-web
  template:
    metadata:
      labels:
        app: z-config-web
    spec:
      containers:
        - name: z-config-web
          image: z-config-web:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
            - name: netty
              containerPort: 12888
          env:
            # ModuleDataSourceTemplate 读 z.base.db.config.*（缺省 fallback 到
            # z.base.db.default.*），连接串由 host/port/database 三个键拼出来，
            # **不接受完整 jdbc url**，所以只能逐项给。
            - name: Z_BASE_DB_CONFIG_HOST
              value: rm-bp108uqlgwn712k54ho.mysql.rds.aliyuncs.com
            - name: Z_BASE_DB_CONFIG_PORT
              value: "3306"
            - name: Z_BASE_DB_CONFIG_DATABASE
              value: oc
            - name: Z_BASE_DB_CONFIG_USERNAME
              value: zifang
            - name: Z_BASE_DB_CONFIG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: z-config-db
                  key: password
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: z-config-web
  namespace: z-config
spec:
  selector:
    app: z-config-web
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
# 8080 对外 NodePort（HTTP REST / 前端静态资源）
apiVersion: v1
kind: Service
metadata:
  name: z-config-web-http
  namespace: z-config
spec:
  type: NodePort
  selector:
    app: z-config-web
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 31808
---
# 12888 = Netty 配置推送长端口（Constance.serveBindPort），
# 订阅配置的客户端连这个口，与 HTTP 口分开暴露。
apiVersion: v1
kind: Service
metadata:
  name: z-config-web-netty
  namespace: z-config
spec:
  type: NodePort
  selector:
    app: z-config-web
  ports:
    - name: netty
      port: 12888
      targetPort: 12888
      nodePort: 31888
