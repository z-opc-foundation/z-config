# z-config 服务端部署（ns z-config）
#
# DB：阿里云 RDS（主机名走 Secret `aliyun-db` 的 `db-host` 键，仓内不留云端地址字面量），库 oc。
# **库里的 z_* 表已经存在且有数据（z_config_info 8 行、z_users 1 行），
# 比仓内 _doc/002_deploy/init.sql 还新（多一张 z_config_approval）——
# 所以这里不建库、不跑 init.sql，只让应用连上去。**
#
# 口令走 Secret z-config-db（用 kubectl create secret 命令在集群里建，
# 不落明文进仓）：见文件末尾注释的命令。
#
# ⚠️ **主机名为什么也走 secret**（001_凭证管理规范 第 8 行 / 第 140 行验收项）：
#   规范把「RDS 地址 + 密码」并列为**明文云端凭证**，地址那一半同样禁止字面量 ——
#   口令早就 Secret 化了，地址没做完，改造漏网不是"还没开始"。
#   写法口径与 z-ops/deploy/kubernetes/04-admin.yaml 逐字对齐（secret: aliyun-db / key: db-host）。
#   ⚠️ **本仓是 public 仓** ⇒ 这里的明文等于对全网公开。
#   **别把它改回明文** —— 下一个维护者看到字面量会觉得"更直观"，那就是规范第 140 行在报警。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: z-config-web
  namespace: z-config
  labels:
    app: z-config-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: z-config-web
  template:
    metadata:
      labels:
        app: z-config-web
    spec:
      containers:
        - name: z-config-web
          # ⚠ 这行必须 == 线上 live 的 image（卡 TASK-20261022-005）：
          #   2026-10-22 01:2x 实测 live = z-config-web:1.0.0，而这里曾写 :local。
          #   :local 是**浮动 tag**，指向修 SSO 闸门**之前**的构建 ⇒ 谁 apply 这份清单，
          #   60 个未鉴权的管理端点就整体放回来。
          #   改 tag 前先重读 live：kubectl -n z-config get deploy z-config-web \
          #     -o jsonpath='{.spec.template.spec.containers[0].image}'
          #
          # ⚠ 2026-10-22 (TASK-20261022-T1 · Nacos 兼容面下线)：**已对齐到新 tag**。
          #   发版派发单号：zconfig-101-t1nacos-202610221824（2026-10-22 18:23 CST）
          #     → live = z-config-web:1.0.1（本行逐字一致）
          #   本版带上的：Nacos 兼容面 /nacos/v1/** **整段下线**（用户 2026-10-22 拍板 T1 = 直接下线）
          #     ⇒ 线上 /nacos/v1/** 全部落点由 200/404 → **404**（JSON 错误信封，非 SPA 首页）；
          #       连带 020 卡的 SSO 闸门修复（7791b34）也一并上线。
          #   ⚠ 回滚：改 image 回 **z-config-web:1.0.0**（旧 tag 仍在两节点 containerd 里
          #     ⇒ 可直接回滚，不需重新灌）。
          image: z-config-web:1.0.1
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
            - name: netty
              containerPort: 12888
          env:
            # ModuleDataSourceTemplate 读 z.base.db.config.*（缺省 fallback 到
            # z.base.db.default.*），连接串由 host/port/database 三个键拼出来，
            # **不接受完整 jdbc url**，所以只能逐项给。
            # 主机名也走 secret（001_凭证管理规范：RDS 地址与口令并列为明文云端凭证）。
            # ⚠️ secretKeyRef 只能读**同 namespace** 的 secret ⇒ ns z-config 要自己有一份 aliyun-db：
            #   RDS_HOST=<真值>   # 真值在 lead/004_重要秘钥/z-opc.env（不要写进本仓）
            #   kubectl -n z-config create secret generic aliyun-db --from-literal=db-host="$RDS_HOST"
            #   （**只用 create，不要 apply** —— apply 会把手工灌的真值覆盖成占位符，
            #     踩坑记录见 z-ops/deploy/kubernetes/01-secret.yaml 开头那段）
            - name: Z_BASE_DB_CONFIG_HOST
              valueFrom:
                secretKeyRef:
                  name: aliyun-db
                  key: db-host
            - name: Z_BASE_DB_CONFIG_PORT
              value: "3306"
            - name: Z_BASE_DB_CONFIG_DATABASE
              value: oc
            - name: Z_BASE_DB_CONFIG_USERNAME
              value: zifang
            - name: Z_BASE_DB_CONFIG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: z-config-db
                  key: password
            # ⚠ 2026-10-22 (TASK-20261021-026)：DB 健康贡献者的**秒级超时**。
            #   卡内铁证：RDS 抖动时健康端点出现
            #   "DataSourceHealthIndicator ... took 952809ms to respond"（15.9 分钟）
            #   ⇒ DB 不可用时健康端点不是快速返回 DOWN，而是挂住十几分钟。
            #   建连接那一段的兜底是 JDBC URL 的 connectTimeout
            #   （z-boot ModuleDataSourceTemplate 统一加，本服务走它）⇒ 两处一起才闭环。
            - name: MANAGEMENT_HEALTH_DB_VALIDATION_QUERY_TIMEOUT
              value: "3s"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            # 2026-10-22 (TASK-20261021-026)：timeoutSeconds 缺省 = **1** ⇒ 含 DB 往返的
            # 健康检查只有 1s 预算，RDS 抖动 1s 就判失败 ⇒ 放宽到 5s（同 z-ops-admin 口径）。
            timeoutSeconds: 5
          livenessProbe:
            # 本服务 liveness 打的是 **tcpSocket**（不是 HTTP 健康端点）⇒ **不碰 DB**
            #   ⇒ DB 抖动不会触发重启（本卡第 3 项在此已天然满足，保持口径不变）。
            tcpSocket:
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20
            # 2026-10-22 (TASK-20261021-026)：timeoutSeconds 缺省 = 1 ⇒ 放宽到 5s；
            # failureThreshold 显式写 6（原缺省 3 = 3×20s = 60s 连续失败即重启 ⇒ 抖动窗口太短）。
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: z-config-web
  namespace: z-config
spec:
  selector:
    app: z-config-web
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
# 8080 对外 NodePort（HTTP REST / 前端静态资源）
apiVersion: v1
kind: Service
metadata:
  name: z-config-web-http
  namespace: z-config
spec:
  type: NodePort
  selector:
    app: z-config-web
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 31808
---
# 12888 = Netty 配置推送长端口（Constance.serveBindPort），
# 订阅配置的客户端连这个口，与 HTTP 口分开暴露。
apiVersion: v1
kind: Service
metadata:
  name: z-config-web-netty
  namespace: z-config
spec:
  type: NodePort
  selector:
    app: z-config-web
  ports:
    - name: netty
      port: 12888
      targetPort: 12888
      nodePort: 31888
