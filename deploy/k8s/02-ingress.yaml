apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: z-config
  namespace: z-config
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: config.zopc.top
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: z-config-web
                port:
                  number: 8080
